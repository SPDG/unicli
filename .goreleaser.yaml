# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: unicli

before:
  hooks:
    - go mod tidy

builds:
  - id: unicli
    main: ./cmd/unicli
    binary: unicli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/SPDG/unicli/internal/cli.Version={{.Version}}
  - id: unicli-mcp
    main: ./cmd/unicli-mcp
    binary: unicli-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/SPDG/unicli/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: SPDG
    name: unicli

# Publishes Formula/unicli.rb to SPDG/homebrew-tap when TAP_GITHUB_TOKEN is set
# (PAT/fine-grained token with contents:write on that repo). Without it the
# release still succeeds; bump the formula by hand until the secret exists.
brews:
  - name: unicli
    ids:
      - unicli
      - unicli-mcp
    repository:
      owner: SPDG
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://spdg.github.io/unicli/
    description: Agent-friendly CLI for UniFi Network, Protect, and Access
    license: MIT
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    extra_install: |
      bin.install "unicli-mcp"
    test: |
      system "#{bin}/unicli", "--version"
