# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: unicli

before:
  hooks:
    - go mod tidy

builds:
  - id: unicli
    main: ./cmd/unicli
    binary: unicli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/SPDG/unicli/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: SPDG
    name: unicli
